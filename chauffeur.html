<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chauffeur Opérateur | E360S</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f4f6f8;
}

/* Bande jaune */

.hero-top {
    background-color: #E8E21A;
    text-align: center;
    padding: 25px;
}

.logo {
    width: 280px;
    max-width: 90%;
}

/* Bannière camion */

.banner {
    height: 600px;
    background-image: url('images/Camion.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay {
    text-align: center;
    padding: 20px;
}

/* Titre */

.hero-title {
    color: #00A3E0;
    font-size: 70px;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 2px 2px 8px rgba(255,255,255,0.8);
}

/* Sous-titre */

.hero-subtitle {
    color: white;
    font-size: 24px;
    font-weight: 600;
    margin-top: 15px;
}

/* Mobile */

@media (max-width: 768px) {

    .banner {
        height: 400px;
    }

    .hero-title {
        font-size: 42px;
    }

    .hero-subtitle {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="hero-top">

    <img srcogo.jpg

</div>

<div class="banner">

    <div class="overlay">

        <h1 class="hero-title">
            Chauffeur Opérateur
        </h1>

        <p class="hero-subtitle">
            Classe 1 • Classe 3 • Plusieurs régions du Québec
        </p>

    </div>

</div>

</body>

</html>
